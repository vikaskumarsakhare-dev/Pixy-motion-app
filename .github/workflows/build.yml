name: Build Pixy Motion APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get files
        uses: actions/checkout@v4

      - name: Check required files
        run: |
          missing=0
          for f in index.html app.js editor.js store.js timeline.js export.js; do
            if [ ! -f "$f" ]; then echo "MISSING FILE: $f"; missing=1; fi
          done
          if [ "$missing" = "1" ]; then exit 1; fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Create Android project
        run: |
          mkdir -p "android/$(dirname settings.gradle)"
          cat > android/settings.gradle <<'PIXY_EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "PixyMotion"
          include ':app'
          PIXY_EOF
          mkdir -p "android/$(dirname build.gradle)"
          cat > android/build.gradle <<'PIXY_EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          PIXY_EOF
          mkdir -p "android/$(dirname gradle.properties)"
          cat > android/gradle.properties <<'PIXY_EOF'
          org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          PIXY_EOF
          mkdir -p "android/$(dirname app/build.gradle)"
          cat > android/app/build.gradle <<'PIXY_EOF'
          plugins {
              id 'com.android.application'
          }

          def vc = (project.findProperty('verCode') ?: '1').toString().toInteger()
          def vn = (project.findProperty('verName') ?: '1.0').toString()

          android {
              namespace 'com.pixymotion.app'
              compileSdk 34

              defaultConfig {
                  applicationId 'com.pixymotion.app'
                  minSdk 24
                  targetSdk 34
                  versionCode vc
                  versionName vn
              }

              signingConfigs {
                  release {
                      storeFile file("$rootDir/pixy.keystore")
                      storePassword 'pixymotion'
                      keyAlias 'pixy'
                      keyPassword 'pixymotion'
                  }
              }

              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled false
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              lint {
                  checkReleaseBuilds false
                  abortOnError false
              }
          }

          dependencies {
              implementation 'androidx.webkit:webkit:1.11.0'
          }
          PIXY_EOF
          mkdir -p "android/$(dirname app/src/main/AndroidManifest.xml)"
          cat > android/app/src/main/AndroidManifest.xml <<'PIXY_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:label="@string/app_name"
                  android:icon="@mipmap/ic_launcher"
                  android:allowBackup="true"
                  android:hardwareAccelerated="true"
                  android:theme="@style/AppTheme">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden|smallestScreenSize|screenLayout|density|uiMode"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          PIXY_EOF
          mkdir -p "android/$(dirname app/src/main/java/com/pixymotion/app/MainActivity.java)"
          cat > android/app/src/main/java/com/pixymotion/app/MainActivity.java <<'PIXY_EOF'
          package com.pixymotion.app;

          import android.app.Activity;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Bundle;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebResourceResponse;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          import androidx.webkit.WebViewAssetLoader;

          public class MainActivity extends Activity {
              private static final int REQ_FILE = 7;
              private WebView web;
              private ValueCallback<Uri[]> fileCb;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  web = new WebView(this);
                  web.setBackgroundColor(0xFF0F0F17);
                  setContentView(web);

                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setAllowFileAccess(false);
                  s.setAllowContentAccess(true);

                  final WebViewAssetLoader loader = new WebViewAssetLoader.Builder()
                          .addPathHandler("/assets/", new WebViewAssetLoader.AssetsPathHandler(this))
                          .build();

                  web.setWebViewClient(new WebViewClient() {
                      @Override
                      public WebResourceResponse shouldInterceptRequest(WebView view, WebResourceRequest request) {
                          return loader.shouldInterceptRequest(request.getUrl());
                      }
                  });

                  web.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public boolean onShowFileChooser(WebView w, ValueCallback<Uri[]> cb, FileChooserParams params) {
                          if (fileCb != null) fileCb.onReceiveValue(null);
                          fileCb = cb;
                          try {
                              startActivityForResult(params.createIntent(), REQ_FILE);
                          } catch (Exception e) {
                              fileCb = null;
                              return false;
                          }
                          return true;
                      }
                  });

                  web.addJavascriptInterface(new Exporter(this), "PixyNative");

                  web.loadUrl("https://appassets.androidplatform.net/assets/index.html");
              }

              @Override
              protected void onActivityResult(int requestCode, int resultCode, Intent data) {
                  if (requestCode == REQ_FILE) {
                      if (fileCb != null) {
                          fileCb.onReceiveValue(WebChromeClient.FileChooserParams.parseResult(resultCode, data));
                          fileCb = null;
                      }
                      return;
                  }
                  super.onActivityResult(requestCode, resultCode, data);
              }

              @Override
              protected void onPause() {
                  super.onPause();
                  if (web != null) {
                      web.evaluateJavascript("window.dispatchEvent(new Event('pagehide'))", null);
                  }
              }

              @Override
              public void onBackPressed() {
                  if (web == null) {
                      finish();
                      return;
                  }
                  web.evaluateJavascript(
                          "(function(){try{return window.onAndroidBack()?'1':'0'}catch(e){return '0'}})()",
                          new ValueCallback<String>() {
                              @Override
                              public void onReceiveValue(String v) {
                                  if (!"\"1\"".equals(v)) finish();
                              }
                          });
              }
          }
          PIXY_EOF
          mkdir -p "android/$(dirname app/src/main/java/com/pixymotion/app/Exporter.java)"
          cat > android/app/src/main/java/com/pixymotion/app/Exporter.java <<'PIXY_EOF'
          package com.pixymotion.app;

          import android.app.Activity;
          import android.content.ContentValues;
          import android.graphics.Bitmap;
          import android.graphics.BitmapFactory;
          import android.graphics.Canvas;
          import android.graphics.Paint;
          import android.graphics.Rect;
          import android.media.MediaCodec;
          import android.media.MediaCodecInfo;
          import android.media.MediaFormat;
          import android.media.MediaMuxer;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Environment;
          import android.provider.MediaStore;
          import android.util.Base64;
          import android.view.Surface;
          import android.view.WindowManager;
          import android.webkit.JavascriptInterface;

          import java.io.File;
          import java.io.FileInputStream;
          import java.io.FileOutputStream;
          import java.io.InputStream;
          import java.io.OutputStream;
          import java.nio.ByteBuffer;

          /**
           * Receives finished frames (JPEG, base64) from the page one by one and encodes them
           * into an H.264 MP4 file, then saves it to the phone gallery.
           */
          public class Exporter {
              private final Activity act;
              private MediaCodec enc;
              private MediaMuxer mux;
              private Surface surf;
              private File tmp;
              private int track = -1;
              private boolean muxStarted = false;
              private long frames = 0;
              private int fps = 30, w = 0, h = 0;
              private String name = "PixyMotion";
              private final MediaCodec.BufferInfo info = new MediaCodec.BufferInfo();
              private final Paint paint = new Paint(Paint.FILTER_BITMAP_FLAG);

              public Exporter(Activity a) {
                  act = a;
              }

              @JavascriptInterface
              public synchronized String exportStart(int width, int height, int frameRate, String fileName) {
                  try {
                      cleanup();
                      w = width;
                      h = height;
                      fps = frameRate;
                      name = safeName(fileName);
                      tmp = new File(act.getCacheDir(), "pixy_export.mp4");
                      if (tmp.exists()) tmp.delete();

                      long br = (long) (w * (long) h * fps * 0.15);
                      if (br < 2000000L) br = 2000000L;
                      if (br > 20000000L) br = 20000000L;

                      MediaFormat fmt = MediaFormat.createVideoFormat("video/avc", w, h);
                      fmt.setInteger(MediaFormat.KEY_COLOR_FORMAT, MediaCodecInfo.CodecCapabilities.COLOR_FormatSurface);
                      fmt.setInteger(MediaFormat.KEY_BIT_RATE, (int) br);
                      fmt.setInteger(MediaFormat.KEY_FRAME_RATE, fps);
                      fmt.setInteger(MediaFormat.KEY_I_FRAME_INTERVAL, 1);

                      enc = MediaCodec.createEncoderByType("video/avc");
                      enc.configure(fmt, null, null, MediaCodec.CONFIGURE_FLAG_ENCODE);
                      surf = enc.createInputSurface();
                      enc.start();

                      mux = new MediaMuxer(tmp.getAbsolutePath(), MediaMuxer.OutputFormat.MUXER_OUTPUT_MPEG_4);
                      track = -1;
                      muxStarted = false;
                      frames = 0;
                      return "ok";
                  } catch (Throwable e) {
                      cleanup();
                      return "error: " + e;
                  }
              }

              @JavascriptInterface
              public synchronized String exportFrame(String b64) {
                  try {
                      if (enc == null || surf == null) return "error: not started";
                      byte[] d = Base64.decode(b64, Base64.DEFAULT);
                      Bitmap bm = BitmapFactory.decodeByteArray(d, 0, d.length);
                      if (bm == null) return "error: bad frame";
                      Canvas c = surf.lockCanvas(null);
                      c.drawBitmap(bm, null, new Rect(0, 0, w, h), paint);
                      surf.unlockCanvasAndPost(c);
                      bm.recycle();
                      drain(false);
                      return "ok";
                  } catch (Throwable e) {
                      cleanup();
                      return "error: " + e;
                  }
              }

              @JavascriptInterface
              public synchronized String exportFinish() {
                  try {
                      if (enc == null) return "error: not started";
                      enc.signalEndOfInputStream();
                      drain(true);
                      enc.stop();
                      enc.release();
                      enc = null;
                      if (surf != null) {
                          surf.release();
                          surf = null;
                      }
                      if (!muxStarted) {
                          cleanup();
                          return "error: no video data";
                      }
                      mux.stop();
                      mux.release();
                      mux = null;
                      String where = saveToGallery();
                      cleanup();
                      return "ok:" + where;
                  } catch (Throwable e) {
                      cleanup();
                      return "error: " + e;
                  }
              }

              @JavascriptInterface
              public synchronized void exportCancel() {
                  cleanup();
              }

              @JavascriptInterface
              public void keepAwake(final boolean on) {
                  act.runOnUiThread(new Runnable() {
                      @Override
                      public void run() {
                          if (on) act.getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
                          else act.getWindow().clearFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
                      }
                  });
              }

              /* ---------------- internals ---------------- */

              private void drain(boolean eos) {
                  int guard = 0;
                  while (true) {
                      int idx = enc.dequeueOutputBuffer(info, eos ? 10000 : 0);
                      if (idx == MediaCodec.INFO_TRY_AGAIN_LATER) {
                          if (!eos) return;
                          if (++guard > 600) return;
                          continue;
                      }
                      if (idx == MediaCodec.INFO_OUTPUT_FORMAT_CHANGED) {
                          track = mux.addTrack(enc.getOutputFormat());
                          mux.start();
                          muxStarted = true;
                          continue;
                      }
                      if (idx < 0) continue;
                      ByteBuffer buf = enc.getOutputBuffer(idx);
                      if ((info.flags & MediaCodec.BUFFER_FLAG_CODEC_CONFIG) != 0) info.size = 0;
                      if (info.size > 0 && muxStarted && buf != null) {
                          buf.position(info.offset);
                          buf.limit(info.offset + info.size);
                          info.presentationTimeUs = frames * 1000000L / fps;
                          frames++;
                          mux.writeSampleData(track, buf, info);
                      }
                      enc.releaseOutputBuffer(idx, false);
                      if ((info.flags & MediaCodec.BUFFER_FLAG_END_OF_STREAM) != 0) return;
                  }
              }

              private String saveToGallery() throws Exception {
                  String file = name + ".mp4";
                  if (Build.VERSION.SDK_INT >= 29) {
                      ContentValues v = new ContentValues();
                      v.put(MediaStore.Video.Media.DISPLAY_NAME, file);
                      v.put(MediaStore.Video.Media.MIME_TYPE, "video/mp4");
                      v.put(MediaStore.Video.Media.RELATIVE_PATH, "Movies/PixyMotion");
                      v.put(MediaStore.Video.Media.IS_PENDING, 1);
                      Uri uri = act.getContentResolver().insert(MediaStore.Video.Media.EXTERNAL_CONTENT_URI, v);
                      if (uri == null) throw new Exception("gallery refused");
                      OutputStream os = act.getContentResolver().openOutputStream(uri);
                      copy(tmp, os);
                      ContentValues done = new ContentValues();
                      done.put(MediaStore.Video.Media.IS_PENDING, 0);
                      act.getContentResolver().update(uri, done, null, null);
                      return "Movies/PixyMotion/" + file;
                  } else {
                      File dir = act.getExternalFilesDir(Environment.DIRECTORY_MOVIES);
                      if (dir == null) dir = act.getFilesDir();
                      dir.mkdirs();
                      File out = new File(dir, file);
                      copy(tmp, new FileOutputStream(out));
                      return out.getAbsolutePath();
                  }
              }

              private void copy(File from, OutputStream os) throws Exception {
                  InputStream in = new FileInputStream(from);
                  try {
                      byte[] b = new byte[65536];
                      int n;
                      while ((n = in.read(b)) > 0) os.write(b, 0, n);
                  } finally {
                      in.close();
                      os.close();
                  }
              }

              private String safeName(String s) {
                  if (s == null) s = "";
                  s = s.replaceAll("[^A-Za-z0-9_-]", "_");
                  if (s.length() > 40) s = s.substring(0, 40);
                  if (s.replace("_", "").length() == 0) s = "PixyMotion";
                  return s + "_" + System.currentTimeMillis() / 1000;
              }

              private void cleanup() {
                  try { if (enc != null) { enc.stop(); } } catch (Throwable e) { }
                  try { if (enc != null) { enc.release(); } } catch (Throwable e) { }
                  enc = null;
                  try { if (surf != null) surf.release(); } catch (Throwable e) { }
                  surf = null;
                  try { if (mux != null && muxStarted) mux.stop(); } catch (Throwable e) { }
                  try { if (mux != null) mux.release(); } catch (Throwable e) { }
                  mux = null;
                  muxStarted = false;
                  try { if (tmp != null && tmp.exists()) tmp.delete(); } catch (Throwable e) { }
              }
          }
          PIXY_EOF
          mkdir -p "android/$(dirname app/src/main/res/values/styles.xml)"
          cat > android/app/src/main/res/values/styles.xml <<'PIXY_EOF'
          <resources>
              <style name="AppTheme" parent="android:Theme.DeviceDefault.NoActionBar">
                  <item name="android:statusBarColor">#0f0f17</item>
                  <item name="android:navigationBarColor">#0f0f17</item>
                  <item name="android:windowBackground">#0f0f17</item>
              </style>
          </resources>
          PIXY_EOF
          mkdir -p "android/$(dirname app/src/main/res/values/strings.xml)"
          cat > android/app/src/main/res/values/strings.xml <<'PIXY_EOF'
          <resources>
              <string name="app_name">Pixy Motion</string>
          </resources>
          PIXY_EOF
          echo '' | base64 -d > android/pixy.keystore
          [ -f icon.png ] || echo '' | base64 -d > icon.png
          A=android/app/src/main
          mkdir -p $A/assets $A/res/mipmap-xxxhdpi
          for f in *.html *.js *.css *.png *.json; do
            [ -f "$f" ] && cp "$f" $A/assets/ || true
          done
          cp icon.png $A/res/mipmap-xxxhdpi/ic_launcher.png
          echo "window.PIXY_VERSION='1.0.${GITHUB_RUN_NUMBER}';" > $A/assets/version.js
          ls -la $A/assets

      - name: Build APK
        run: |
          VC=$(( $(date +%s) / 60 ))
          gradle -p android assembleRelease --no-daemon -PverCode=$VC -PverName=1.0.${GITHUB_RUN_NUMBER}

      - name: Name the APK
        run: cp android/app/build/outputs/apk/release/app-release.apk PixyMotion.apk

      - name: Save APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: PixyMotion
          path: PixyMotion.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Pixy Motion 1.0.${{ github.run_number }}
          files: PixyMotion.apk
