name: Build Pixy Motion APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get files
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check required files
        run: |
          missing=0
          for f in index.html app.js editor.js store.js timeline.js pad.js export.js; do
            if [ ! -f "$f" ]; then echo "MISSING FILE: $f"; missing=1; fi
          done
          if [ "$missing" = "1" ]; then exit 1; fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Get signing key (same key as before, so the app updates over the old one)
        run: |
          set -e
          mkdir -p android
          KS=android/pixy.keystore
          if [ -f pixy.keystore ]; then
            cp pixy.keystore "$KS"
            echo "Signing key: found pixy.keystore in repo"
          else
            for c in $(git rev-list HEAD); do
              B=$(git grep -h -e "base64 -d > android/pixy.keystore" "$c" -- 2>/dev/null | head -1 | sed -E "s/.*echo '([^']+)'.*/\1/" || true)
              if [ "${#B}" -gt 300 ]; then
                echo "$B" | base64 -d > "$KS"
                echo "Signing key: recovered from older commit $c"
                break
              fi
            done
          fi
          if [ ! -s "$KS" ]; then
            echo "ERROR: old signing key not found. Do NOT make a new key (the app would need uninstall)."
            echo "Put the old build.yml (the one that contains base64 ... pixy.keystore) back in the repo history, or add pixy.keystore to the repo root."
            exit 1
          fi
          keytool -list -keystore "$KS" -storepass pixymotion -alias pixy | tail -2
          if [ ! -f pixy.keystore ]; then
            cp "$KS" pixy.keystore
            git config user.name "pixy-bot"
            git config user.email "pixy-bot@users.noreply.github.com"
            git add pixy.keystore
            git commit -m "Save signing key [skip ci]" || true
            git push || echo "could not push key copy (ok)"
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Create Android project
        run: |
          mkdir -p "android/$(dirname settings.gradle)"
          cat > android/settings.gradle <<'PIXY_EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = 'PixyMotion'
          include ':app'
          PIXY_EOF
          mkdir -p "android/$(dirname build.gradle)"
          cat > android/build.gradle <<'PIXY_EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          PIXY_EOF
          mkdir -p "android/$(dirname gradle.properties)"
          cat > android/gradle.properties <<'PIXY_EOF'
          org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          PIXY_EOF
          mkdir -p "android/$(dirname app/build.gradle)"
          cat > android/app/build.gradle <<'PIXY_EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.pixymotion.app'
              compileSdk 34

              defaultConfig {
                  applicationId = 'com.pixymotion.app'
                  minSdk 26
                  targetSdk 34
                  versionCode = Integer.parseInt((project.findProperty('verCode') ?: '1').toString())
                  versionName = (project.findProperty('verName') ?: '1.0').toString()
              }

              signingConfigs {
                  release {
                      storeFile file("$rootDir/pixy.keystore")
                      storePassword 'pixymotion'
                      keyAlias 'pixy'
                      keyPassword 'pixymotion'
                  }
              }

              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled false
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          dependencies {
              implementation 'androidx.webkit:webkit:1.11.0'
          }
          PIXY_EOF
          mkdir -p "android/$(dirname app/src/main/AndroidManifest.xml)"
          cat > android/app/src/main/AndroidManifest.xml <<'PIXY_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:label="@string/app_name"
                  android:icon="@mipmap/ic_launcher"
                  android:theme="@style/AppTheme"
                  android:allowBackup="true"
                  android:hardwareAccelerated="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait"
                      android:windowSoftInputMode="adjustResize"
                      android:configChanges="orientation|screenSize|keyboardHidden|smallestScreenSize|screenLayout|uiMode">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          PIXY_EOF
          mkdir -p "android/$(dirname app/src/main/java/com/pixymotion/app/MainActivity.java)"
          cat > android/app/src/main/java/com/pixymotion/app/MainActivity.java <<'PIXY_EOF'
          package com.pixymotion.app;

          import android.app.Activity;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Bundle;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebResourceResponse;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          import androidx.webkit.WebViewAssetLoader;

          public class MainActivity extends Activity {
              private WebView web;
              private MediaBridge media;
              private Exporter exporter;
              private WebViewAssetLoader loader;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  web = new WebView(this);
                  web.setBackgroundColor(0xFF0A0C18);
                  setContentView(web);

                  media = new MediaBridge(this, web);
                  exporter = new Exporter(this);
                  loader = new WebViewAssetLoader.Builder()
                          .addPathHandler("/assets/", new WebViewAssetLoader.AssetsPathHandler(this))
                          .build();

                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setMediaPlaybackRequiresUserGesture(false);
                  s.setAllowFileAccess(false);
                  s.setAllowContentAccess(false);

                  web.setWebChromeClient(new WebChromeClient());
                  web.setWebViewClient(new WebViewClient() {
                      @Override
                      public WebResourceResponse shouldInterceptRequest(WebView view, WebResourceRequest request) {
                          Uri u = request.getUrl();
                          String p = u.getPath();
                          if (p != null && p.startsWith("/media/")) {
                              return media.serve(request);
                          }
                          return loader.shouldInterceptRequest(u);
                      }
                  });
                  web.addJavascriptInterface(exporter, "PixyNative");
                  web.addJavascriptInterface(media, "PixyMedia");
                  web.loadUrl("https://appassets.androidplatform.net/assets/index.html");
              }

              @Override
              protected void onActivityResult(int requestCode, int resultCode, Intent data) {
                  super.onActivityResult(requestCode, resultCode, data);
                  media.onResult(requestCode, resultCode, data);
              }

              @Override
              public void onBackPressed() {
                  web.evaluateJavascript("(window.onAndroidBack ? window.onAndroidBack() : false)", value -> {
                      if (!"true".equals(value)) {
                          moveTaskToBack(true);
                      }
                  });
              }

              @Override
              protected void onPause() {
                  super.onPause();
                  web.onPause();
              }

              @Override
              protected void onResume() {
                  super.onResume();
                  web.onResume();
              }
          }
          PIXY_EOF
          mkdir -p "android/$(dirname app/src/main/java/com/pixymotion/app/Exporter.java)"
          cat > android/app/src/main/java/com/pixymotion/app/Exporter.java <<'PIXY_EOF'
          package com.pixymotion.app;

          import android.app.Activity;
          import android.content.ContentValues;
          import android.graphics.Bitmap;
          import android.graphics.BitmapFactory;
          import android.media.Image;
          import android.media.MediaCodec;
          import android.media.MediaCodecInfo;
          import android.media.MediaFormat;
          import android.media.MediaMuxer;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Environment;
          import android.os.ParcelFileDescriptor;
          import android.provider.MediaStore;
          import android.util.Base64;
          import android.view.WindowManager;
          import android.webkit.JavascriptInterface;

          import java.io.File;
          import java.nio.ByteBuffer;

          /** Receives JPEG frames from JS and encodes them to an H.264 MP4 in Movies/PixyMotion. */
          public class Exporter {
              private final Activity act;
              private MediaCodec codec;
              private MediaMuxer muxer;
              private ParcelFileDescriptor pfd;
              private Uri uri;
              private File outFile;
              private int track = -1, w, h, fps;
              private boolean started, active;
              private long frame;
              private String name;
              private final MediaCodec.BufferInfo info = new MediaCodec.BufferInfo();

              Exporter(Activity a) {
                  act = a;
              }

              @JavascriptInterface
              public void keepAwake(final boolean on) {
                  act.runOnUiThread(() -> {
                      if (on) act.getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
                      else act.getWindow().clearFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
                  });
              }

              @JavascriptInterface
              public synchronized boolean exportStart(int width, int height, int fps, String fileName) {
                  try {
                      cleanup(true);
                      this.w = width & ~1;
                      this.h = height & ~1;
                      this.fps = fps;
                      this.name = (fileName == null || fileName.isEmpty()) ? "pixy" : fileName;
                      MediaFormat f = MediaFormat.createVideoFormat(MediaFormat.MIMETYPE_VIDEO_AVC, w, h);
                      f.setInteger(MediaFormat.KEY_COLOR_FORMAT, MediaCodecInfo.CodecCapabilities.COLOR_FormatYUV420Flexible);
                      long br = (long) (w * (long) h * fps * 0.14);
                      f.setInteger(MediaFormat.KEY_BIT_RATE, (int) Math.min(Math.max(br, 2000000L), 20000000L));
                      f.setInteger(MediaFormat.KEY_FRAME_RATE, fps);
                      f.setInteger(MediaFormat.KEY_I_FRAME_INTERVAL, 1);
                      codec = MediaCodec.createEncoderByType(MediaFormat.MIMETYPE_VIDEO_AVC);
                      codec.configure(f, null, null, MediaCodec.CONFIGURE_FLAG_ENCODE);
                      codec.start();

                      if (Build.VERSION.SDK_INT >= 29) {
                          ContentValues cv = new ContentValues();
                          cv.put(MediaStore.Video.Media.DISPLAY_NAME, this.name + ".mp4");
                          cv.put(MediaStore.Video.Media.MIME_TYPE, "video/mp4");
                          cv.put(MediaStore.Video.Media.RELATIVE_PATH, Environment.DIRECTORY_MOVIES + "/PixyMotion");
                          cv.put(MediaStore.Video.Media.IS_PENDING, 1);
                          uri = act.getContentResolver().insert(MediaStore.Video.Media.EXTERNAL_CONTENT_URI, cv);
                          pfd = act.getContentResolver().openFileDescriptor(uri, "w");
                          muxer = new MediaMuxer(pfd.getFileDescriptor(), MediaMuxer.OutputFormat.MUXER_OUTPUT_MPEG_4);
                      } else {
                          File d = act.getExternalFilesDir(Environment.DIRECTORY_MOVIES);
                          d.mkdirs();
                          outFile = new File(d, this.name + "_" + System.currentTimeMillis() + ".mp4");
                          muxer = new MediaMuxer(outFile.getAbsolutePath(), MediaMuxer.OutputFormat.MUXER_OUTPUT_MPEG_4);
                      }
                      track = -1;
                      started = false;
                      frame = 0;
                      active = true;
                      return true;
                  } catch (Throwable t) {
                      cleanup(true);
                      return false;
                  }
              }

              @JavascriptInterface
              public synchronized boolean exportFrame(String b64) {
                  if (!active) return false;
                  try {
                      byte[] jpg = Base64.decode(b64, Base64.DEFAULT);
                      Bitmap bmp = BitmapFactory.decodeByteArray(jpg, 0, jpg.length);
                      if (bmp == null) return false;
                      if (bmp.getWidth() != w || bmp.getHeight() != h) {
                          Bitmap s = Bitmap.createScaledBitmap(bmp, w, h, true);
                          bmp.recycle();
                          bmp = s;
                      }
                      int[] px = new int[w * h];
                      bmp.getPixels(px, 0, w, 0, 0, w, h);
                      bmp.recycle();

                      int idx;
                      int guard = 0;
                      while ((idx = codec.dequeueInputBuffer(10000)) < 0) {
                          drain(false);
                          if (++guard > 1000) return false;
                      }
                      Image img = codec.getInputImage(idx);
                      fill(img, px);
                      long pts = frame * 1000000L / fps;
                      codec.queueInputBuffer(idx, 0, w * h * 3 / 2, pts, 0);
                      frame++;
                      drain(false);
                      return true;
                  } catch (Throwable t) {
                      return false;
                  }
              }

              @JavascriptInterface
              public synchronized String exportFinish() {
                  if (!active) return "";
                  try {
                      int idx;
                      int guard = 0;
                      while ((idx = codec.dequeueInputBuffer(10000)) < 0) {
                          drain(false);
                          if (++guard > 1000) break;
                      }
                      if (idx >= 0) {
                          codec.queueInputBuffer(idx, 0, 0, frame * 1000000L / fps, MediaCodec.BUFFER_FLAG_END_OF_STREAM);
                      }
                      drain(true);
                      codec.stop();
                      codec.release();
                      codec = null;
                      if (started) muxer.stop();
                      muxer.release();
                      muxer = null;
                      String result;
                      if (uri != null) {
                          if (pfd != null) pfd.close();
                          pfd = null;
                          ContentValues cv = new ContentValues();
                          cv.put(MediaStore.Video.Media.IS_PENDING, 0);
                          act.getContentResolver().update(uri, cv, null, null);
                          result = "Movies/PixyMotion/" + name + ".mp4";
                      } else {
                          result = outFile.getAbsolutePath();
                      }
                      active = false;
                      uri = null;
                      return started ? result : "";
                  } catch (Throwable t) {
                      cleanup(true);
                      return "";
                  }
              }

              @JavascriptInterface
              public synchronized void exportCancel() {
                  cleanup(true);
              }

              private void fill(Image img, int[] px) {
                  Image.Plane[] pl = img.getPlanes();
                  ByteBuffer yb = pl[0].getBuffer(), ub = pl[1].getBuffer(), vb = pl[2].getBuffer();
                  int ys = pl[0].getRowStride(), yp = pl[0].getPixelStride();
                  int us = pl[1].getRowStride(), up = pl[1].getPixelStride();
                  int vs = pl[2].getRowStride(), vp = pl[2].getPixelStride();
                  byte[] row = new byte[w];
                  for (int y = 0; y < h; y++) {
                      int o = y * w;
                      for (int x = 0; x < w; x++) {
                          int c = px[o + x];
                          int r = (c >> 16) & 255, g = (c >> 8) & 255, b = c & 255;
                          row[x] = (byte) (((66 * r + 129 * g + 25 * b + 128) >> 8) + 16);
                      }
                      if (yp == 1) {
                          yb.position(y * ys);
                          yb.put(row, 0, w);
                      } else {
                          for (int x = 0; x < w; x++) yb.put(y * ys + x * yp, row[x]);
                      }
                  }
                  for (int y = 0; y < h / 2; y++) {
                      for (int x = 0; x < w / 2; x++) {
                          int p0 = px[2 * y * w + 2 * x], p1 = px[2 * y * w + 2 * x + 1];
                          int p2 = px[(2 * y + 1) * w + 2 * x], p3 = px[(2 * y + 1) * w + 2 * x + 1];
                          int r = (((p0 >> 16) & 255) + ((p1 >> 16) & 255) + ((p2 >> 16) & 255) + ((p3 >> 16) & 255)) >> 2;
                          int g = (((p0 >> 8) & 255) + ((p1 >> 8) & 255) + ((p2 >> 8) & 255) + ((p3 >> 8) & 255)) >> 2;
                          int b = ((p0 & 255) + (p1 & 255) + (p2 & 255) + (p3 & 255)) >> 2;
                          int u = ((-38 * r - 74 * g + 112 * b + 128) >> 8) + 128;
                          int v = ((112 * r - 94 * g - 18 * b + 128) >> 8) + 128;
                          ub.put(y * us + x * up, (byte) u);
                          vb.put(y * vs + x * vp, (byte) v);
                      }
                  }
              }

              private void drain(boolean eos) {
                  int tries = 0;
                  while (true) {
                      int o = codec.dequeueOutputBuffer(info, eos ? 10000 : 0);
                      if (o == MediaCodec.INFO_TRY_AGAIN_LATER) {
                          if (!eos || ++tries > 500) break;
                      } else if (o == MediaCodec.INFO_OUTPUT_FORMAT_CHANGED) {
                          track = muxer.addTrack(codec.getOutputFormat());
                          muxer.start();
                          started = true;
                      } else if (o >= 0) {
                          ByteBuffer ob = codec.getOutputBuffer(o);
                          if ((info.flags & MediaCodec.BUFFER_FLAG_CODEC_CONFIG) != 0) info.size = 0;
                          if (info.size > 0 && started && ob != null) {
                              ob.position(info.offset);
                              ob.limit(info.offset + info.size);
                              muxer.writeSampleData(track, ob, info);
                          }
                          codec.releaseOutputBuffer(o, false);
                          if ((info.flags & MediaCodec.BUFFER_FLAG_END_OF_STREAM) != 0) break;
                      }
                  }
              }

              private void cleanup(boolean deleteOutput) {
                  active = false;
                  try { if (codec != null) { codec.stop(); } } catch (Throwable t) { }
                  try { if (codec != null) { codec.release(); } } catch (Throwable t) { }
                  codec = null;
                  try { if (muxer != null) { if (started) muxer.stop(); muxer.release(); } } catch (Throwable t) { }
                  muxer = null;
                  try { if (pfd != null) pfd.close(); } catch (Throwable t) { }
                  pfd = null;
                  if (deleteOutput) {
                      try { if (uri != null) act.getContentResolver().delete(uri, null, null); } catch (Throwable t) { }
                      try { if (outFile != null) outFile.delete(); } catch (Throwable t) { }
                  }
                  uri = null;
                  outFile = null;
                  started = false;
              }
          }
          PIXY_EOF
          mkdir -p "android/$(dirname app/src/main/java/com/pixymotion/app/MediaBridge.java)"
          cat > android/app/src/main/java/com/pixymotion/app/MediaBridge.java <<'PIXY_EOF'
          package com.pixymotion.app;

          import android.app.Activity;
          import android.content.ClipData;
          import android.content.Intent;
          import android.database.Cursor;
          import android.net.Uri;
          import android.provider.OpenableColumns;
          import android.webkit.JavascriptInterface;
          import android.webkit.MimeTypeMap;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebResourceResponse;
          import android.webkit.WebView;

          import org.json.JSONArray;
          import org.json.JSONObject;

          import java.io.File;
          import java.io.FileInputStream;
          import java.io.FileOutputStream;
          import java.io.IOException;
          import java.io.InputStream;
          import java.io.OutputStream;
          import java.util.ArrayList;
          import java.util.HashMap;
          import java.util.List;
          import java.util.Map;
          import java.util.UUID;

          /** Picks photos/videos with the system picker, copies them into app storage and serves them to the WebView. */
          public class MediaBridge {
              static final int REQ = 7421;
              private final Activity act;
              private final WebView web;
              private final File dir;

              MediaBridge(Activity a, WebView w) {
                  act = a;
                  web = w;
                  dir = new File(a.getFilesDir(), "media");
                  dir.mkdirs();
              }

              @JavascriptInterface
              public void pick() {
                  act.runOnUiThread(() -> {
                      Intent i = new Intent(Intent.ACTION_GET_CONTENT);
                      i.setType("*/*");
                      i.putExtra(Intent.EXTRA_MIME_TYPES, new String[]{"image/*", "video/*"});
                      i.putExtra(Intent.EXTRA_ALLOW_MULTIPLE, true);
                      i.addCategory(Intent.CATEGORY_OPENABLE);
                      act.startActivityForResult(Intent.createChooser(i, "Pixy Motion"), REQ);
                  });
              }

              @JavascriptInterface
              public void deleteMedia(String name) {
                  if (name == null) return;
                  new File(dir, new File(name).getName()).delete();
              }

              void onResult(int req, int res, Intent data) {
                  if (req != REQ || res != Activity.RESULT_OK || data == null) return;
                  final List<Uri> uris = new ArrayList<>();
                  ClipData cd = data.getClipData();
                  if (cd != null) {
                      for (int i = 0; i < cd.getItemCount(); i++) uris.add(cd.getItemAt(i).getUri());
                  } else if (data.getData() != null) {
                      uris.add(data.getData());
                  }
                  new Thread(() -> {
                      JSONArray arr = new JSONArray();
                      for (Uri u : uris) {
                          try {
                              String mime = act.getContentResolver().getType(u);
                              if (mime == null) mime = "image/*";
                              String ext = MimeTypeMap.getSingleton().getExtensionFromMimeType(mime);
                              if (ext == null) ext = mime.startsWith("video") ? "mp4" : "png";
                              String disp = display(u);
                              String file = UUID.randomUUID().toString().replace("-", "").substring(0, 12) + "." + ext;
                              try (InputStream in = act.getContentResolver().openInputStream(u);
                                   OutputStream out = new FileOutputStream(new File(dir, file))) {
                                  byte[] buf = new byte[65536];
                                  int n;
                                  while ((n = in.read(buf)) > 0) out.write(buf, 0, n);
                              }
                              JSONObject o = new JSONObject();
                              o.put("file", file);
                              o.put("mime", mime);
                              o.put("name", disp);
                              arr.put(o);
                          } catch (Exception e) {
                              // skip this file
                          }
                      }
                      final String js = "window.onMediaPicked(" + JSONObject.quote(arr.toString()) + ")";
                      act.runOnUiThread(() -> web.evaluateJavascript(js, null));
                  }).start();
              }

              private String display(Uri u) {
                  try (Cursor c = act.getContentResolver().query(u, null, null, null, null)) {
                      if (c != null && c.moveToFirst()) {
                          int i = c.getColumnIndex(OpenableColumns.DISPLAY_NAME);
                          if (i >= 0) {
                              String n = c.getString(i);
                              int d = n.lastIndexOf('.');
                              return d > 0 ? n.substring(0, d) : n;
                          }
                      }
                  } catch (Exception e) {
                      // ignore
                  }
                  return "Media";
              }

              private static String mimeOf(String name) {
                  String ext = MimeTypeMap.getFileExtensionFromUrl(name);
                  String m = ext == null ? null : MimeTypeMap.getSingleton().getMimeTypeFromExtension(ext.toLowerCase());
                  return m == null ? "application/octet-stream" : m;
              }

              /** Serves /media/<file> with HTTP Range support so video seeking works. */
              WebResourceResponse serve(WebResourceRequest r) {
                  try {
                      String name = new File(Uri.decode(r.getUrl().getLastPathSegment())).getName();
                      File f = new File(dir, name);
                      Map<String, String> h = new HashMap<>();
                      h.put("Access-Control-Allow-Origin", "*");
                      if (!f.exists()) {
                          return new WebResourceResponse("text/plain", "utf-8", 404, "Not Found", h, new java.io.ByteArrayInputStream(new byte[0]));
                      }
                      String mime = mimeOf(name);
                      long len = f.length();
                      h.put("Accept-Ranges", "bytes");
                      String range = r.getRequestHeaders() == null ? null : r.getRequestHeaders().get("Range");
                      if (range != null && range.startsWith("bytes=")) {
                          String[] p = range.substring(6).split("-");
                          long s = p[0].isEmpty() ? 0 : Long.parseLong(p[0]);
                          long e = (p.length > 1 && !p[1].isEmpty()) ? Long.parseLong(p[1]) : len - 1;
                          if (e >= len) e = len - 1;
                          if (s > e) s = 0;
                          h.put("Content-Range", "bytes " + s + "-" + e + "/" + len);
                          h.put("Content-Length", String.valueOf(e - s + 1));
                          return new WebResourceResponse(mime, null, 206, "Partial Content", h, new RangeStream(f, s, e - s + 1));
                      }
                      h.put("Content-Length", String.valueOf(len));
                      return new WebResourceResponse(mime, null, 200, "OK", h, new FileInputStream(f));
                  } catch (Exception e) {
                      return null;
                  }
              }

              private static class RangeStream extends InputStream {
                  private final FileInputStream in;
                  private long left;

                  RangeStream(File f, long start, long length) throws IOException {
                      in = new FileInputStream(f);
                      long skipped = 0;
                      while (skipped < start) {
                          long k = in.skip(start - skipped);
                          if (k <= 0) break;
                          skipped += k;
                      }
                      left = length;
                  }

                  @Override
                  public int read() throws IOException {
                      if (left <= 0) return -1;
                      int b = in.read();
                      if (b >= 0) left--;
                      return b;
                  }

                  @Override
                  public int read(byte[] b, int off, int len) throws IOException {
                      if (left <= 0) return -1;
                      int n = in.read(b, off, (int) Math.min(len, left));
                      if (n > 0) left -= n;
                      return n;
                  }

                  @Override
                  public void close() throws IOException {
                      in.close();
                  }
              }
          }
          PIXY_EOF
          mkdir -p "android/$(dirname app/src/main/res/values/styles.xml)"
          cat > android/app/src/main/res/values/styles.xml <<'PIXY_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="android:Theme.DeviceDefault.NoActionBar">
                  <item name="android:windowBackground">@android:color/black</item>
                  <item name="android:statusBarColor">#0A0C18</item>
                  <item name="android:navigationBarColor">#0A0C18</item>
              </style>
          </resources>
          PIXY_EOF
          mkdir -p "android/$(dirname app/src/main/res/values/strings.xml)"
          cat > android/app/src/main/res/values/strings.xml <<'PIXY_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">Pixy Motion</string>
          </resources>
          PIXY_EOF
          A=android/app/src/main
          mkdir -p $A/assets $A/res/mipmap-xxxhdpi
          for f in *.html *.js *.css *.png *.json; do
            [ -f "$f" ] && cp "$f" $A/assets/ || true
          done
          if [ -f icon.png ]; then cp icon.png $A/res/mipmap-xxxhdpi/ic_launcher.png; else echo '' | base64 -d > $A/res/mipmap-xxxhdpi/ic_launcher.png; fi
          if [ ! -f $A/assets/icon.png ]; then cp $A/res/mipmap-xxxhdpi/ic_launcher.png $A/assets/icon.png; fi
          echo "window.PIXY_VERSION='1.0.${GITHUB_RUN_NUMBER}';" > $A/assets/version.js
          ls -la $A/assets

      - name: Build APK
        run: |
          VC=$(( $(date +%s) / 60 ))
          gradle -p android assembleRelease --no-daemon -PverCode=$VC -PverName=1.0.${GITHUB_RUN_NUMBER}

      - name: Name the APK
        run: cp android/app/build/outputs/apk/release/app-release.apk PixyMotion.apk

      - name: Save APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: PixyMotion
          path: PixyMotion.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Pixy Motion 1.0.${{ github.run_number }}
          files: PixyMotion.apk
