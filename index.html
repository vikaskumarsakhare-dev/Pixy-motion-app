<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Pixy Motion</title>
<style>
:root{--bg:#0f0f17;--panel:#1a1a26;--panel2:#242434;--tx:#f2f2f7;--mu:#9a9ab0;--ac:#7c5cff;--ac2:#ff5ca0;--bd:#2c2c3e}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font-family:'Noto Sans Devanagari','Noto Sans',system-ui,sans-serif;-webkit-user-select:none;user-select:none;overscroll-behavior:none;-webkit-tap-highlight-color:transparent;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
.screen{position:fixed;inset:0;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
.hidden{display:none!important}
.top{display:flex;align-items:center;gap:6px;height:52px;padding:0 8px;flex:none}
.top .ttl{flex:1;font-size:17px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 4px}
.ib{width:44px;height:44px;display:flex;align-items:center;justify-content:center;border-radius:12px;color:var(--tx)}
.ib:active{background:var(--panel2)}
.ib.dis{opacity:.3;pointer-events:none}
.brand{display:flex;align-items:center;gap:10px;flex:1;padding-left:8px}
.brand img{width:36px;height:36px;border-radius:9px}
.brand b{font-size:19px}
/* home */
#plist{flex:1;overflow:auto;padding:6px 14px 110px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;align-content:start}
.hh{grid-column:1/-1;font-size:14px;color:var(--mu);margin:6px 2px 0}
.card{background:var(--panel);border:1px solid var(--bd);border-radius:14px;overflow:hidden;position:relative}
.card .th{height:150px;display:flex;align-items:center;justify-content:center;background:#07070b}
.card .th img{max-width:100%;max-height:100%;object-fit:contain}
.card .meta{padding:8px 10px;font-size:13px}
.card .meta b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:26px}
.card .meta span{color:var(--mu);font-size:12px}
.card .dots{position:absolute;right:2px;bottom:4px;width:36px;height:36px;display:flex;align-items:center;justify-content:center;color:var(--mu)}
.empty{grid-column:1/-1;text-align:center;padding:60px 20px;color:var(--mu)}
.empty h3{color:var(--tx);margin:0 0 8px;font-size:18px}
.empty img{width:84px;height:84px;border-radius:20px;margin-bottom:16px}
.fab{position:fixed;right:18px;bottom:calc(22px + env(safe-area-inset-bottom));display:flex;align-items:center;gap:8px;padding:0 20px 0 16px;height:54px;border-radius:27px;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;font-weight:600;font-size:16px}
/* editor */
#stage{flex:1;position:relative;overflow:hidden;background:#07070b;touch-action:none}
#stage canvas{position:absolute;touch-action:none}
#cv{box-shadow:0 0 0 1px #333}
#ctxbar{display:flex;gap:2px;overflow-x:auto;background:var(--panel);border-top:1px solid var(--bd);padding:4px 6px;flex:none;scrollbar-width:none}
#ctxbar::-webkit-scrollbar{display:none}
.cb{flex:none;min-width:58px;height:50px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;color:var(--tx);border-radius:10px;padding:0 6px}
.cb:active{background:var(--panel2)}
.cb.red{color:#ff6b6b}
#toolbar{display:flex;justify-content:space-around;background:var(--panel);border-top:1px solid var(--bd);padding:4px 4px calc(4px + env(safe-area-inset-bottom));flex:none}
.tb{flex:1;height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;border-radius:10px}
.tb:active{background:var(--panel2)}
/* sheet */
#sheetbg{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:20}
#sheet{position:fixed;left:0;right:0;bottom:0;max-height:78%;overflow:auto;background:var(--panel);border-radius:20px 20px 0 0;z-index:21;padding:14px 16px calc(18px + env(safe-area-inset-bottom));border-top:1px solid var(--bd)}
#sheet h4{margin:0 0 12px;font-size:16px}
.row{display:flex;align-items:center;gap:10px;margin:10px 0}
.row label{font-size:13px;color:var(--mu);min-width:76px}
.row input[type=range]{flex:1;accent-color:var(--ac)}
.btn{height:44px;padding:0 18px;border-radius:12px;background:var(--panel2);border:1px solid var(--bd);font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.pri{background:linear-gradient(135deg,var(--ac),var(--ac2));border:0;color:#fff;font-weight:600}
.btn.red{color:#ff6b6b}
.btn.on{outline:2px solid var(--ac)}
.btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.btns .btn{flex:1;min-width:110px}
.sw{display:flex;flex-wrap:wrap;gap:10px;margin:10px 0}
.sw i{width:38px;height:38px;border-radius:50%;border:2px solid rgba(255,255,255,.25);display:block}
.sw i.on{border-color:#fff;box-shadow:0 0 0 2px var(--ac)}
.sw input{width:38px;height:38px;border:0;padding:0;background:none}
textarea,input[type=text]{width:100%;background:var(--panel2);color:var(--tx);border:1px solid var(--bd);border-radius:12px;padding:12px;font:inherit;font-size:16px;user-select:text;-webkit-user-select:text;outline:none}
textarea{min-height:96px;resize:none}
.sizes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.sz{background:var(--panel2);border:1px solid var(--bd);border-radius:14px;padding:12px 6px;display:flex;flex-direction:column;align-items:center;gap:10px;font-size:12px;text-align:center}
.sz u{display:block;background:linear-gradient(135deg,var(--ac),var(--ac2));border-radius:4px}
.shp{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.shp button{background:var(--panel2);border:1px solid var(--bd);border-radius:14px;padding:14px 6px;display:flex;flex-direction:column;align-items:center;gap:8px;font-size:12px}
.lrow{display:flex;align-items:center;gap:4px;background:var(--panel2);border:1px solid var(--bd);border-radius:12px;padding:4px 4px 4px 12px;margin-bottom:8px}
.lrow.sel{border-color:var(--ac)}
.lrow .nm{flex:1;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:10px 0}
.lrow .ib{width:38px;height:38px}
.note{font-size:12px;color:var(--mu);line-height:1.5;margin-top:14px}

/* timeline */
#tlbar{display:flex;align-items:center;gap:4px;background:var(--panel);border-top:1px solid var(--bd);padding:0 4px;height:48px;flex:none}
#tlbar .ib{width:42px;height:42px}
#tlTime{font-size:12px;color:var(--mu);min-width:92px;text-align:center;font-variant-numeric:tabular-nums}
#tlSeek{flex:1;min-width:0;accent-color:var(--ac2)}
#tlrows{display:flex;flex-direction:column;height:190px;background:#13131d;border-top:1px solid var(--bd);flex:none}
#tlhead{display:flex;align-items:center;gap:6px;padding:4px 8px;flex:none}
#tlhead .chip{height:32px;padding:0 12px;border-radius:16px;background:var(--panel2);border:1px solid var(--bd);font-size:13px}
#tlhead .sp{flex:1}
#tlhead .ib{width:34px;height:34px;background:var(--panel2);border-radius:17px}
#tlscroll{flex:1;overflow:auto;position:relative}
#tlin{position:relative;min-height:100%}
.tlruler{position:sticky;top:0;height:24px;background:#1a1a26;z-index:3;border-bottom:1px solid var(--bd);touch-action:none}
.tick{position:absolute;top:0;bottom:0;border-left:1px solid #3a3a50;font-size:10px;color:var(--mu);padding-left:3px;line-height:24px}
.tlrow{position:relative;height:36px;border-bottom:1px solid #20202e}
.tlrow.sel{background:#1d1b30}
.tllab{position:sticky;left:0;width:78px;height:35px;background:#161622;z-index:2;display:flex;align-items:center;gap:4px;padding:0 6px;font-size:11px;color:var(--tx);border-right:1px solid var(--bd);float:left}
.tllab span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tlbar2{position:absolute;top:5px;height:26px;border-radius:7px;background:#5e5ce6;touch-action:none}
.tlbar2.text{background:#d4478a}
.tlbar2.shape{background:#139e92}
.tlrow.sel .tlbar2{outline:2px solid #fff}
.hdl{position:absolute;top:0;bottom:0;width:16px;touch-action:none}
.hdl.l{left:0;border-left:4px solid rgba(255,255,255,.75);border-radius:7px 0 0 7px}
.hdl.r{right:0;border-right:4px solid rgba(255,255,255,.75);border-radius:0 7px 7px 0}
.dia{position:absolute;top:11px;width:14px;height:14px;background:#ffd60a;transform:rotate(45deg);border-radius:2px;z-index:2}
.tlph{position:absolute;top:0;bottom:0;width:2px;background:#ff5ca0;z-index:4;pointer-events:none;margin-left:-1px}
.tlempty{padding:14px 90px;font-size:12px;color:var(--mu)}

.expov{position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:50;display:flex;align-items:center;justify-content:center;padding:24px}
.expbox{width:100%;max-width:420px;background:var(--panel);border:1px solid var(--bd);border-radius:18px;padding:20px}
.expbox h4{margin:0 0 14px;font-size:17px}
.expbar{height:12px;border-radius:6px;background:var(--panel2);overflow:hidden}
.expbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--ac),var(--ac2))}
.expnum{margin:10px 0 4px;font-size:14px;color:var(--tx);font-variant-numeric:tabular-nums}

#pad{display:flex;gap:10px;align-items:center;background:#13131d;border-top:1px solid var(--bd);padding:6px 8px;flex:none}
.pdpad{display:grid;grid-template-columns:repeat(3,40px);grid-template-rows:repeat(3,40px);gap:3px;flex:none}
.pb{display:flex;align-items:center;justify-content:center;border-radius:10px;background:var(--panel2);border:1px solid var(--bd);color:var(--tx);font-size:12px;touch-action:none}
.pb:active{background:#34344a}
.pb.mid{font-size:10px;border-radius:50%}
.pb.sm{width:38px;height:30px;font-size:18px;flex:none}
.pdr{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.pdxy{font-size:12px;color:var(--mu);font-variant-numeric:tabular-nums}
.pdrow{display:flex;align-items:center;gap:6px}
.pdrow label{width:46px;font-size:11px;color:var(--mu);flex:none}
.pdv{flex:1;text-align:center;font-size:13px;font-variant-numeric:tabular-nums}
.pdstep{display:flex;gap:4px;align-items:center}
.pdstep .chip{height:26px;padding:0 9px;border-radius:13px;background:var(--panel2);border:1px solid var(--bd);font-size:11px;display:flex;align-items:center}
.pdstep .chip.on{outline:2px solid var(--ac)}
.pdstep .close{margin-left:auto;padding:0 6px}
.cb.key.on{color:#ffd60a}
.tlbar2.video{background:#d9831a}
.tlbar2.null{background:#4b4b66}
.tlbar2.camera{background:#b8962a}
.tlbar2.fixed{pointer-events:auto}
.pdstep .pgb{font-weight:700}
.pdstep{flex-wrap:wrap}
.tb{font-size:11px}
#toast{position:fixed;left:50%;bottom:calc(120px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#000c;color:#fff;padding:10px 16px;border-radius:20px;font-size:14px;z-index:40;pointer-events:none;max-width:86%;text-align:center}
</style>
</head>
<body>

<div id="home" class="screen">
  <div class="top">
    <div class="brand"><img src="icon.png" alt=""><b data-i="appName">Pixy Motion</b></div>
    <button class="ib" id="btnSet" aria-label="Settings"></button>
  </div>
  <div id="plist"></div>
  <button class="fab" id="btnNew"><span id="plusI"></span><span data-i="newProject">New project</span></button>
</div>

<div id="editor" class="screen hidden">
  <div class="top">
    <button class="ib" id="btnBack" aria-label="Back"></button>
    <button class="ttl" id="pname" style="text-align:left"></button>
    <button class="ib" id="btnExport" aria-label="Export"></button>
    <button class="ib" id="btnUndo" aria-label="Undo"></button>
    <button class="ib" id="btnRedo" aria-label="Redo"></button>
  </div>
  <div id="stage"><canvas id="cv"></canvas><canvas id="ov"></canvas></div>
  <div id="tlbar">
    <button class="ib" id="tlPlay" aria-label="Play"></button>
    <span id="tlTime">0:00.0 / 0:05.0</span>
    <input type="range" id="tlSeek" min="0" max="5" step="0.01" value="0">
    <button class="ib" id="tlOpen" aria-label="Timeline"></button>
  </div>
  <div id="tlrows" class="hidden">
    <div id="tlhead">
      <button class="chip" id="tlDur"></button>
      <span class="sp"></span>
      <button class="ib" id="tlZm" aria-label="Zoom out"></button>
      <button class="ib" id="tlZp" aria-label="Zoom in"></button>
    </div>
    <div id="tlscroll"><div id="tlin"></div></div>
  </div>
  <div id="pad" class="hidden"></div>
  <div id="ctxbar"></div>
  <div id="toolbar">
    <button class="tb" id="tPhoto"></button>
    <button class="tb" id="tText"></button>
    <button class="tb" id="tShape"></button>
    <button class="tb" id="tGroup"></button>
    <button class="tb" id="tCam"></button>
    <button class="tb" id="tLayers"></button>
  </div>
</div>

<input type="file" id="file" accept="image/*,video/*" multiple class="hidden">
<div id="sheetbg" class="hidden"></div>
<div id="sheet" class="hidden"></div>
<div id="toast" class="hidden"></div>

<script src="version.js" onerror="void 0"></script>
<script src="store.js"></script>
<script src="editor.js"></script>
<script src="timeline.js"></script>
<script src="pad.js"></script>
<script src="export.js"></script>
<script src="app.js"></script>
</body>
</html>
