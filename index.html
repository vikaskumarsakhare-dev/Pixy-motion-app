<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Pixy Motion</title>
<style>
:root{--bg:#0a0c18;--p1:#12152a;--p2:#1a1e38;--p3:#262b4d;--tx:#e8eaff;--mut:#8a90bd;--a1:#8b5cf6;--a2:#ec4899;--ln:#2d335c;--grad:linear-gradient(135deg,#8b5cf6,#ec4899)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--tx);font-family:Roboto,"Noto Sans","Noto Sans Devanagari",system-ui,sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:manipulation}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input{font:inherit;color:inherit}
.hidden{display:none!important}
.screen{position:fixed;inset:0;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
.ic{flex:none;display:block}
.ib{display:grid;place-items:center;width:40px;height:40px;border-radius:12px;color:#cdd1ff}
.ib:active{background:var(--p3)}
.ib.dis{opacity:.35}
/* home */
#home .hd{display:flex;align-items:center;gap:10px;padding:16px}
#home .hd img{width:38px;height:38px;border-radius:10px}
#home .hd h1{font-size:21px;flex:1;background:var(--grad);-webkit-background-clip:text;color:transparent;font-weight:800}
#plist{flex:1;overflow:auto;padding:4px 16px 100px;display:grid;grid-template-columns:1fr 1fr;gap:12px;align-content:start}
.pc{background:var(--p1);border-radius:16px;overflow:hidden;position:relative;border:1px solid var(--ln)}
.pc .th{aspect-ratio:16/10;background:#000 center/contain no-repeat;display:grid;place-items:center;color:var(--mut)}
.pc .nm{padding:8px 10px 10px;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc small{display:block;color:var(--mut);font-size:11px;margin-top:2px}
.pc .mb{position:absolute;right:2px;top:2px;background:#0008;width:34px;height:34px}
#empty{grid-column:1/3;text-align:center;color:var(--mut);padding:70px 20px;white-space:pre-line;line-height:1.6}
#fab{position:absolute;right:20px;bottom:calc(24px + env(safe-area-inset-bottom));width:62px;height:62px;border-radius:22px;background:var(--grad);display:grid;place-items:center;box-shadow:0 8px 24px #8b5cf655;color:#fff}
/* editor */
#top{height:50px;flex:none}.tp{height:50px;display:flex;align-items:center;padding:0 6px;gap:2px}
#pname,#lname{flex:1;text-align:center;font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:8px}
#exp{background:var(--grad);color:#fff;border-radius:12px;width:44px}
#stage{flex:1;min-height:90px;position:relative;display:grid;place-items:center;background:#05060e;overflow:hidden;touch-action:none}
#cv{background:#000;box-shadow:0 0 0 1px #2d335c;touch-action:none}
#pztag{position:absolute;left:50%;top:10px;transform:translateX(-50%);background:#000c;color:#fff;font-weight:700;font-size:15px;padding:4px 14px;border-radius:12px;pointer-events:none;z-index:5;font-variant-numeric:tabular-nums}
#ctl{height:46px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 8px;background:var(--p1)}
#ctl .mid{display:flex;gap:4px;align-items:center}
#play{background:var(--grad);color:#fff;border-radius:50%;width:42px;height:42px}
#lower{flex:none;display:flex;flex-direction:column;overflow:hidden;min-height:0}
#tbar{height:28px;flex:none;display:flex;align-items:center;justify-content:center;gap:14px;background:var(--p1);font-variant-numeric:tabular-nums;font-size:14px;letter-spacing:.5px}
#tbar .ib{width:30px;height:26px;color:var(--a2)}
#tbar .tm{min-width:84px;text-align:center;font-weight:600}
#tbar .ib.hid{visibility:hidden}
#tlwrap{position:relative;flex:1;min-height:0;background:var(--bg)}
#tlwrap.small{flex:none;height:68px}
#tl{position:absolute;inset:0;overflow:auto;touch-action:pan-x pan-y;scrollbar-width:none}
#tl::-webkit-scrollbar{display:none}
#cline{position:absolute;top:0;bottom:0;left:50%;width:2px;margin-left:-1px;background:#fff;box-shadow:0 0 8px #fff9;pointer-events:none;z-index:20}
#cline:before{content:"";position:absolute;top:0;left:-5px;border:6px solid transparent;border-top:8px solid #fff;border-bottom:0}
.tlin{position:relative;min-height:100%}
.trow{display:flex;height:38px;position:relative}
.trow.ruler{height:22px;position:sticky;top:0;z-index:12;background:var(--p1)}
.lc{position:sticky;left:0;z-index:10;width:60px;flex:none;background:var(--p1);display:flex;align-items:center;justify-content:center;border-right:1px solid var(--ln)}
.lc .ib{width:28px;height:30px;border-radius:8px}
.lc .ib.off,.lc .ib.on{color:var(--a2)}
.lay.sel .lc{background:var(--p3)}
.trk{position:relative;flex:none;height:100%}
.ruler .trk .tk{position:absolute;top:14px;width:1px;height:8px;background:var(--ln)}
.ruler .trk .tk.b{top:8px;height:14px;background:var(--mut)}
.tk b{position:absolute;top:-10px;left:4px;font-size:10px;font-weight:400;color:var(--mut)}
.endm{position:absolute;top:0;bottom:0;width:2px;background:var(--a2);opacity:.5}
.bar{position:absolute;top:4px;height:30px;border-radius:9px;display:flex;align-items:center;gap:5px;padding:0 6px 0 3px;overflow:visible;background:#3b4390;border:1.5px solid #4f59b8;color:#fff;font-size:11px;white-space:nowrap}
.bar .bn{overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.bar .thumb{width:22px;height:22px;border-radius:6px;background:#0005 center/cover;display:grid;place-items:center;flex:none;overflow:hidden}
.ty-text{background:#8a2f67;border-color:#c4468f}.ty-shape{background:#5b3aa8;border-color:#8b5cf6}
.ty-audio,.bar.ty-audio.tb{background-color:#1f6a3a;border-color:#34d399}.ty-null{background:#6a5a1a;border-color:#fbbf24}.ty-camera{background:#14675f;border-color:#2dd4bf}.ty-video{background:#1e5a8a;border-color:#38a3e8}
.lay.sel .bar{border-color:#fff;box-shadow:0 0 0 1px #fff7}
.hdl{position:absolute;top:-1px;bottom:-1px;width:14px;display:none;background:#fff;opacity:.95}
.hdl.l{left:-5px;border-radius:8px 0 0 8px}.hdl.r{right:-5px;border-radius:0 8px 8px 0}
.lay.sel .hdl{display:block}
.kd{position:absolute;top:50%;width:11px;height:11px;margin:-5.5px 0 0 -5.5px;background:#ffd84a;transform:rotate(45deg);border:1.5px solid #5a4500;z-index:3}
/* bottom */
#bottom{flex:none;background:var(--p1);border-top:1px solid var(--ln);display:flex;flex-direction:column}
#bottom.grow{flex:1;min-height:0}
#menu{display:flex;height:66px;padding:0 4px 6px;overflow-x:auto;scrollbar-width:none}
#menu::-webkit-scrollbar{display:none}
#menu button{flex:0 0 25%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10.5px;color:#c3c8f5;min-width:0}
#menu button:active{background:var(--p3);border-radius:12px}
#menu button.soon{opacity:.55}
#lsel{display:flex;flex-direction:column;flex:1;min-height:0}
.lt{display:flex;height:50px;flex:none;align-items:center;gap:5px;padding:0 8px}
.lt button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:9.5px;height:42px;border-radius:10px;background:var(--p2);min-width:0;padding:0 1px;line-height:1.05;text-align:center}
.lt button.on{color:var(--a2)}
.tabs{display:flex;flex:1;min-height:0;gap:8px;padding:2px 8px 10px}
.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;background:var(--p2);border-radius:14px;font-size:12.5px;color:#d5d9ff}
.tabs button:active{background:var(--p3)}
#panel{flex:1;min-height:0;overflow:auto}
/* pad */
.pad{display:flex;height:100%;padding:6px;gap:6px}
.pad.locked{opacity:.5}
.pl,.pr{width:46px;display:flex;flex-direction:column;gap:4px;flex:none}
.pb{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;border-radius:12px;background:var(--p2);color:#c9ceff}
.pb small{font-size:9px;color:var(--mut)}
.pb.on{background:var(--grad);color:#fff}.pb.on small{color:#fff}
.pb[data-a=key].on{background:#ffd84a;color:#3a2c00}
.pm{flex:1;display:flex;flex-direction:column;gap:5px;min-width:0}
.nums{display:flex;gap:6px;height:44px;flex:none;align-items:center}
.nb{flex:1;display:flex;align-items:center;background:var(--p2);border-radius:10px;height:34px;padding:0 8px;gap:5px;min-width:0;border:1px solid transparent}
.nb.act{border-color:var(--a1)}
.nb span{font-size:11px;color:var(--a2);font-weight:700}
.nb input{width:100%;min-width:0;background:none;border:0;outline:0;font-size:14px;text-align:right}
.lk{width:34px;height:34px;border-radius:10px;background:var(--p2);display:grid;place-items:center;color:var(--mut)}
.lk.on{background:var(--grad);color:#fff}
.surf{flex:1;border-radius:14px;background:#0e1124;border:1px solid var(--ln);position:relative;touch-action:none;display:grid;place-items:center;overflow:hidden}
.hint{color:#ffffff22;pointer-events:none}
.dial{display:none;position:absolute;width:112px;height:112px;border-radius:50%;border:3px solid #8b5cf6;pointer-events:none}
.dial i{position:absolute;left:50%;top:-8px;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:var(--grad)}
.surf[data-mode=rot] .dial{display:block}
.surf[data-mode=depth]{background:linear-gradient(#0e1124,#1a1650)}
/* generic panels */
.pp{padding:10px 14px;display:flex;flex-direction:column;gap:10px}
.sl{display:flex;align-items:center;gap:10px;font-size:12px;color:#c9ceff}
.sl span{width:78px;flex:none}
.sl input[type=range]{flex:1;accent-color:#a78bfa}
.sl em{width:40px;text-align:right;font-style:normal;color:var(--mut);font-size:11px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:7px 12px;border-radius:10px;background:var(--p2);font-size:12.5px}
.chip.on{background:var(--grad);color:#fff}
.sw{display:flex;gap:6px;flex-wrap:wrap}
.sw i{width:28px;height:28px;border-radius:50%;border:2px solid #fff3}
.sw i.on{border-color:#fff}
input.tx,textarea.tx{font-family:inherit;width:100%;background:var(--p2);border:1px solid var(--ln);border-radius:10px;padding:9px 10px;font-size:15px;user-select:text;-webkit-user-select:text;resize:none}
/* sheets / dialogs */
#ov{position:fixed;inset:0;z-index:50;background:#000a;display:flex;align-items:flex-end}
.sheet{width:100%;max-height:82%;overflow:auto;background:var(--p1);border-radius:22px 22px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));border-top:1px solid var(--ln)}
.sheet h3{font-size:16px;margin-bottom:12px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.grid4 button{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 2px;background:var(--p2);border-radius:14px;font-size:11.5px}
.list button{display:flex;align-items:center;gap:12px;width:100%;padding:13px 6px;border-bottom:1px solid var(--ln);font-size:15px;text-align:left}
.list button.red{color:#ff7a90}.list button.on{color:var(--a2)}
.btn{background:var(--grad);color:#fff;border-radius:12px;padding:12px 20px;font-weight:600;font-size:15px}
.btn.ghost{background:var(--p2);color:var(--tx)}
.row2{display:flex;gap:10px;justify-content:flex-end;margin-top:14px}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#000d;color:#fff;padding:10px 16px;border-radius:12px;z-index:90;font-size:13.5px;max-width:86%;text-align:center;pointer-events:none}
.curve{position:fixed;inset:0;z-index:60;background:#000c;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:16px}
.cvbox{background:var(--p1);border-radius:18px;padding:10px;text-align:center}
.cf{fill:#0e1124;stroke:var(--ln)}.hl{stroke:#8a90bd;stroke-width:1.5}.cp{fill:none;stroke:#fff;stroke-width:3}.hc{fill:var(--a2);stroke:#fff;stroke-width:2;touch-action:none}
.cvv{font-size:12px;color:var(--mut);margin-top:4px}
.presets{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;max-width:340px}
.presets button{padding:7px 11px;border-radius:10px;background:var(--p2);font-size:12px}.presets button.on{background:var(--grad)}
#exprog{position:fixed;inset:0;z-index:70;background:#000d;display:flex;flex-direction:column;gap:18px;align-items:center;justify-content:center}
#exprog .bar2{width:70%;height:10px;border-radius:6px;background:var(--p2);overflow:hidden}
#exprog .bar2 i{display:block;height:100%;width:0;background:var(--grad)}

.kd{width:12px;height:12px;margin:-6px 0 0 -6px}
.kd:after{content:"";position:absolute;inset:-9px}
.kd.cur{background:#fff;border-color:#8a6a00;box-shadow:none;z-index:4}
.bar.tb{background-size:auto 100%;background-repeat:repeat-x;background-position:left center;text-shadow:0 1px 3px #000,0 0 3px #000;border-color:#ffffff66}
.bar.lift{transform:scale(1.04);box-shadow:0 6px 16px #000b;z-index:6;border-color:#ffd84a}
.mk{position:absolute;top:0;margin-left:-3px;color:#ffd84a}.mk svg{fill:#ffd84a}
.lay.sel .bar{box-shadow:0 0 0 2px #fff}
.bar,.bar *{touch-action:pan-x pan-y}
.dialw{position:relative;width:132px;height:132px;display:none;place-items:center}
.surf[data-mode=rot] .dialw{display:grid}
.surf[data-mode=rot] .hint{display:none}
.dialw .dial{display:block;position:absolute;left:10px;top:10px;width:112px;height:112px}
.dialw .arc{position:absolute;inset:6px;border-radius:50%;-webkit-mask:radial-gradient(circle,transparent 47px,#000 48px);mask:radial-gradient(circle,transparent 47px,#000 48px)}
.dialw .deg{font-size:17px;font-weight:700;font-variant-numeric:tabular-nums}.dialw.snap .dial{border-color:#ffd84a}.dialw.snap .dial i{background:#ffd84a}
.cnum{display:flex;gap:6px;margin-top:6px}.cnum label{flex:1;display:flex;align-items:center;gap:4px;background:var(--p2);border-radius:8px;padding:0 6px;height:30px}
.cnum span{font-size:10px;color:var(--a2)}.cnum input{width:100%;min-width:0;background:none;border:0;outline:0;font-size:13px;text-align:right}
.ptrack{position:relative;height:22px;margin:10px 4px 2px;border-radius:11px;background:var(--p2)}
.ptrack i{position:absolute;left:0;top:0;width:22px;height:22px;border-radius:50%;background:var(--grad)}
.pdot{fill:#ffd84a}.pv{width:100%;margin-top:8px;padding:8px}
.fxp{display:flex;height:100%;padding:6px;gap:6px}.fxp .pp{flex:1;overflow:auto;padding:4px 6px}
#multi{display:flex;align-items:center;gap:6px;padding:8px;flex-wrap:wrap}
#multi .chip{flex:1;text-align:center;display:flex;gap:6px;align-items:center;justify-content:center}
#multi .cnt{width:100%;font-size:12px;color:var(--mut)}
.ro{display:flex;align-items:center;gap:8px;padding:10px 4px;border-bottom:1px solid var(--ln)}
.ro .nm{flex:1;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ro .ib{width:34px;height:34px;background:var(--p2)}
.seg{display:flex;gap:8px;margin-bottom:12px}.seg button{flex:1;padding:10px;border-radius:12px;background:var(--p2);font-size:14px}.seg button.on{background:var(--grad);color:#fff}
.sw2{display:flex;align-items:center;justify-content:space-between;padding:12px 4px;font-size:15px}
.sw2 i{width:48px;height:28px;border-radius:14px;background:var(--p3);position:relative}.sw2 i:after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.15s}
.sw2 i.on{background:var(--a1)}.sw2 i.on:after{left:23px}
/* ---- Part 7 ---- */
.ng{flex:1;display:flex;height:44px;background:var(--p2);border-radius:12px;border:1.5px solid transparent;min-width:0;overflow:hidden}
.ng.act{border-color:var(--a1)}
.ng[data-g=depth]{flex:0 0 78px}
.nc{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:0;padding:2px 2px 1px}
.nc+.nc{border-left:1px solid var(--ln)}
.nc input{width:100%;min-width:0;background:none;border:0;outline:0;font-size:15px;text-align:center;line-height:1.1;font-variant-numeric:tabular-nums;user-select:text;-webkit-user-select:text}
.nc input:not([readonly]){color:#fff;background:#ffffff14;border-radius:6px}
.nc small{font-size:9.5px;color:var(--mut);line-height:1}
.nc.sel small,.ng.act .nc small{color:var(--a2)}
.nc.sel input{color:var(--a2)}
.cr{position:absolute;width:18px;height:18px;border:2.5px solid #6f77c2;pointer-events:none}
.cr.tl{left:10px;top:10px;border-right:0;border-bottom:0;border-radius:6px 0 0 0}.cr.tr{right:10px;top:10px;border-left:0;border-bottom:0;border-radius:0 6px 0 0}
.cr.bl{left:10px;bottom:10px;border-right:0;border-top:0;border-radius:0 0 0 6px}.cr.br{right:10px;bottom:10px;border-left:0;border-top:0;border-radius:0 0 6px 0}
.dial{border-width:4px!important}
.cs .viz{position:absolute;inset:14px 18px;display:grid;place-items:center;pointer-events:none}.cs .viz svg{width:100%;height:100%}
.vf{fill:#6f77c2}.vl{stroke:#c9ceff;stroke-width:2;fill:none;stroke-linecap:round}.vb{fill:#8b5cf633;stroke:#8b5cf6;stroke-width:1.5}.vb.on{fill:#ec489944;stroke:#ec4899}
.tg{width:48px;height:28px;border-radius:14px;background:var(--p3);position:relative;flex:none}.tg i{position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.15s}
.tg.on{background:var(--a1)}.tg.on i{left:23px}
.cdot{width:30px;height:30px;border-radius:50%;border:2px solid #fff6;flex:none}
#topB.pmode #bGroup2,#topB.pmode #bTrash,#topB.pmode #bMore{display:none}
#topB.pmode #lname{pointer-events:none;text-align:left;padding-left:4px}
#bGroup2.linked{color:var(--a2)}
#bLayers.camon{background:var(--grad);color:#fff}
.lc{touch-action:none}
.lay.lift2{position:relative;z-index:30;background:var(--p3);box-shadow:0 4px 14px #000b}
.ro{position:relative;background:var(--p1)}.ro.lift2{background:var(--p3);border-radius:10px;box-shadow:0 4px 14px #000b}
.tabs.two{display:grid;grid-template-columns:repeat(6,1fr);grid-template-rows:2fr 1fr}.tabs.two button{grid-column:span 2}.tabs.two button.sm{grid-column:span 3;flex-direction:row;gap:8px;font-size:12px}
.shgrid{max-height:52vh;overflow:auto}
.edov{position:fixed;inset:0;z-index:70;background:var(--bg,#0b0c1c);display:flex;flex-direction:column}
.edhd{display:flex;align-items:center;justify-content:space-between;height:52px;padding:0 8px;flex:0 0 auto}.edhd b{font-size:16px}
.edpv{display:flex;justify-content:center;padding:0 12px 10px;flex:0 0 auto}.edpv canvas{border-radius:12px;background:#000;border:1px solid #2b2f58;display:block}
.edbody{flex:1;min-height:0;overflow:auto;padding:4px 12px 24px}
.pshape{grid-template-columns:repeat(4,1fr)!important}.pshape canvas{width:44px;height:44px}
.thl{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0}.th{display:flex;flex-direction:column;align-items:center;gap:3px;width:76px;padding:5px;border-radius:12px;background:var(--p2);font-size:10.5px;color:#c9ceff}.th.on{background:var(--grad);color:#fff}.th img{width:56px;height:56px;border-radius:8px}.th span{max-width:68px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.flipx{transform:scaleX(-1)}
.crow>span:empty{display:none}.crow .sw{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:4px 0}
.cpk{display:inline-flex;width:30px;height:30px;border-radius:50%;overflow:hidden;border:2px solid var(--ln);background:conic-gradient(red,yellow,lime,aqua,blue,magenta,red)}
.cpk input{opacity:0;width:100%;height:100%;border:0;padding:0}
.pgh{font-size:12px;color:var(--mut);margin:12px 0 4px}
#cstrip{position:fixed;inset:0;z-index:45}
#cstrip .csb{position:absolute;right:8px;top:auto;display:flex;flex-direction:column;gap:6px;background:var(--p1);border:1px solid var(--ln);border-radius:16px;padding:6px;box-shadow:0 8px 24px #000b}
#cstrip .ib{width:46px;height:46px}#cstrip .ib.on{background:var(--grad);color:#fff}
.xfx{width:30px;height:30px;flex:none;color:var(--mut)}
.curve{align-items:stretch;justify-content:flex-start;overflow:auto;padding:10px}
.cvwrap{background:var(--p1);border-radius:18px;padding:6px 10px 14px;margin:auto;width:100%;max-width:340px}
.cvhead{display:flex;align-items:center;justify-content:space-between;height:44px}.cvhead b{font-size:15px}
.cvbox{padding:0}.cvbox svg{display:block;margin:0 auto;max-width:100%;height:auto}
.pgh{font-size:11px;color:var(--mut);margin:12px 2px 6px;text-transform:uppercase;letter-spacing:.6px}
.presets{display:grid!important;grid-template-columns:repeat(4,1fr);gap:6px;max-width:none!important}
.presets button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border-radius:10px;background:var(--p2);font-size:10.5px;color:#c9ceff}
.presets button.on{background:var(--grad);color:#fff}
.hc{stroke-width:3}
.hdl.arm{background:#ffd84a}
#cstrip .csb{animation:csin .16s ease-out;transform-origin:bottom right}
@keyframes csin{from{opacity:0;transform:scale(.9) translateY(14px)}to{opacity:1;transform:none}}
#bLayers{transition:background .15s,color .15s}
html,body{overscroll-behavior:none;-webkit-touch-callout:none}
/* camera options: label + ruler rows (like Alight) */
.co{gap:6px}
.cohd{display:flex;justify-content:space-between;align-items:center;height:30px;font-size:12.5px;color:#c9ceff;padding:0 4px;flex:none}
.cobody{display:flex;gap:8px;flex:1;min-height:0}
.cohd .viz{width:92px;height:30px;margin-left:auto}.cohd .viz svg{width:100%;height:100%}
.rows{flex:1;display:flex;flex-direction:column;gap:6px;justify-content:flex-start;min-width:0}
.rr{display:flex;align-items:center;gap:8px;height:44px;background:var(--p2);border-radius:12px;padding:0 10px;flex:none;border:1.5px solid transparent}
.rr.act{border-color:var(--a1)}
.rl{width:58px;flex:none;font-size:10.5px;color:var(--mut);line-height:1.1}.rr.act .rl{color:var(--a2)}
.rk{flex:1;height:32px;position:relative;touch-action:none;background:repeating-linear-gradient(90deg,#5a62a8 0 1px,transparent 1px 8px);background-size:8px 12px;background-repeat:repeat-x;background-position-y:center;-webkit-mask-image:linear-gradient(90deg,transparent,#000 22%,#000 78%,transparent);mask-image:linear-gradient(90deg,transparent,#000 22%,#000 78%,transparent)}
.rk .ctr{position:absolute;left:50%;top:2px;bottom:2px;width:2px;margin-left:-1px;background:var(--a2);border-radius:1px}
.rv{width:62px;flex:none;background:none;border:0;outline:0;text-align:right;font-size:14px;font-variant-numeric:tabular-nums;user-select:text;-webkit-user-select:text}
.rv:not([readonly]){background:#ffffff14;border-radius:6px}

.efl{display:flex;flex-direction:column;gap:6px;margin:8px 0}
.efr{background:var(--p2);border-radius:12px;overflow:hidden;border:1.5px solid transparent}
.efr.tgt{border-color:var(--a2)}.efr.drg{opacity:.6}.efr.off .efh b{opacity:.45}
.efh{display:flex;align-items:center;gap:6px;height:44px;padding:0 6px}
.efh b{flex:1;font-size:13.5px;font-weight:600}
.efarr svg{transition:transform .15s}.efr.open .efarr svg{transform:rotate(90deg)}
.efdrag{width:34px;text-align:center;font-size:20px;color:var(--mut);touch-action:none}
.efb{padding:2px 8px 10px;display:flex;flex-direction:column;gap:6px}
.efbar{display:flex;justify-content:space-between;align-items:center}
.efb .rr{background:var(--p1)}
.kfl{text-align:left;background:none;border:0;color:var(--mut);padding:0}.kfl.hk{color:var(--a2)}.kfl.ok{color:#fff;font-weight:700}
.rk.nor{background:none;-webkit-mask-image:none;mask-image:none}
.efb .rr .chip{padding:5px 9px;font-size:12px}
.efadd{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:44px;border-radius:12px;background:var(--p2);color:#fff;font-size:14px;margin:6px 0}
.fxb .fxq{margin:8px 12px;padding:10px 12px;border-radius:10px;background:var(--p2);border:0;color:#fff;font-size:14px;width:calc(100% - 24px)}
.fxbody{flex:1;overflow:auto;align-content:start;padding:10px 12px 40px;display:grid;gap:10px}
.fxbody.fol{grid-template-columns:1fr 1fr}.fxbody.grd{grid-template-columns:1fr 1fr 1fr}
.fxf{height:78px;border-radius:14px;background:linear-gradient(135deg,#4c3a9e,#8a3d8f);color:#fff;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:2px}
.fxf b{font-size:14px}.fxf span{font-size:11px;opacity:.7}
.fxt{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11px;color:#dfe2ff;position:relative}
.fxt i{width:100%;aspect-ratio:1;border-radius:12px;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:22px;font-weight:700;color:#fff}
.fxt.soon{opacity:.45}.fxt em{position:absolute;top:4px;right:4px;font-style:normal;font-size:9px;background:#0009;padding:2px 5px;border-radius:6px}
.fxb{display:flex;flex-direction:column}
.rotd{transform:rotate(90deg)}
.fxfeat{grid-column:1/-1;display:flex;gap:10px;overflow-x:auto;padding-bottom:6px}.fxfeat .fxt{flex:none;width:96px}
.fxt i{background:#1d2040}.fxt canvas{width:100%;height:100%;border-radius:12px}
.fxf{position:relative;overflow:hidden;background:#1d2040}.fxf canvas{position:absolute;inset:0;width:100%;height:100%;opacity:.9}
.fxf b,.fxf span{position:relative;text-shadow:0 1px 4px #000}.fxf::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,#000a,#0000 60%)}.fxf b{z-index:1;margin-top:34px}.fxf span{z-index:1}
.fxt i canvas{width:100%;height:100%;border-radius:12px}
.dm-white{background:#fff}.dm-dark,.dm-text{background:#14162e}.dm-txt2{background:linear-gradient(135deg,#1e2a4a,#3b2a5e)}.dm-photo{background:#14162e}
.fxt i{overflow:hidden;font-size:0}
</style>
</head>
<body>
<div id="home" class="screen">
  <div class="hd"><img src="icon.png" alt=""><h1>Pixy Motion</h1><button class="ib" id="hset"></button></div>
  <div id="plist"></div>
  <button id="fab"></button>
</div>

<div id="editor" class="screen hidden">
  <div id="top">
    <div class="tp" id="topA"><button class="ib" id="bBack"></button><button id="pname"></button><button class="ib" id="bGroup"></button><button class="ib" id="bSet"></button><button class="ib" id="exp"></button></div>
    <div class="tp hidden" id="topB"><button class="ib" id="bBack2"></button><button id="lname"></button><button class="ib" id="bGroup2"></button><button class="ib" id="bTrash"></button><button class="ib" id="bMore"></button></div>
  </div>
  <div id="stage"><canvas id="cv"></canvas><div id="pztag" class="hidden"></div></div>
  <div id="ctl">
    <div class="mid"><button class="ib" id="bUndo"></button><button class="ib" id="bRedo"></button></div>
    <div class="mid"><button class="ib" id="bFirst"></button><button class="ib" id="play"></button><button class="ib" id="bLast"></button></div>
    <div class="mid"><button class="ib" id="bEdit"></button><button class="ib" id="bLayers"></button></div>
  </div>
  <div id="lower">
    <div id="tbar"><button class="ib hid" id="kPrev"></button><span class="tm" id="tm">00:00:00</span><button class="ib hid" id="kNext"></button></div>
    <div id="tlwrap"><div id="tl"></div><div id="cline"></div></div>
    <div id="bottom">
      <div id="menu"></div>
      <div id="multi" class="hidden"></div>
      <div id="lsel" class="hidden">
        <div class="lt" id="lt"></div>
        <div class="tabs" id="tabs"></div>
        <div id="panel" class="hidden"></div>
      </div>
    </div>
  </div>
</div>
<div id="ov" class="hidden"></div>
<div id="toast" class="hidden"></div>
<div id="exprog" class="hidden"><div id="exmsg"></div><div class="bar2"><i id="exbar"></i></div><button class="btn ghost" id="excancel"></button></div>

<script src="version.js"></script>
<script src="store.js"></script>
<script src="editor.js"></script>
<script src="timeline.js"></script>
<script src="pad.js"></script>
<script src="export.js"></script>
<script src="app.js"></script>
</body>
